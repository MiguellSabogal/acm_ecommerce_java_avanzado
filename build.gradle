plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.8'   // 4.0.5 → 4.0.8: CVE-2026-40976
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.acm'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', "2025.1.1")
	set('spring-framework.version', "7.0.9")   // parche CVE-2026-47884 / CVE-2026-47890
	set('tomcat.version', "11.0.25")            // parche CVE-2026-65182 / 65905 / 68525
}

dependencies {
	// implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'
	implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'
	implementation 'org.mapstruct:mapstruct:1.5.5.Final'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
	// testImplementation 'org.springframework.boot:spring-boot-starter-data-r2dbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	// testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
	// Bouncy Castle 1.81 llega como dependencia transitiva; se fija 1.85 (CVE-2025-14813, CVE-2026-8763)
	dependencies {
		dependency 'org.bouncycastle:bcprov-jdk18on:1.85'
		dependency 'org.bouncycastle:bcpkix-jdk18on:1.85'
		dependency 'org.bouncycastle:bcutil-jdk18on:1.85'
	}
}

// Bouncy Castle *-jdk15on está descontinuado (última versión 1.70) y tiene CVE-2026-8763.
// Se reemplaza por la línea mantenida *-jdk18on 1.85, que corrige la vulnerabilidad.
configurations.configureEach {
	resolutionStrategy.dependencySubstitution {
		substitute module('org.bouncycastle:bcprov-jdk15on') using module('org.bouncycastle:bcprov-jdk18on:1.85') because 'CVE-2026-8763'
		substitute module('org.bouncycastle:bcpkix-jdk15on') using module('org.bouncycastle:bcpkix-jdk18on:1.85') because 'CVE-2026-8763'
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
