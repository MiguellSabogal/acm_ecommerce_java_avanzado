# =============================================================================
#  CI/CD · acm_ecommerce_java_avanzado
#
#   ┌───────┐   ┌──────┐   ┌────────────┐   ┌────────┐   ┌──────────────────┐
#   │ build │──▶│ test │──▶│ image-scan │──▶│ docker │──▶│ deploy (Render)  │
#   └───────┘ ┐ └──────┘ ┌▶│  (Trivy)   │   │ (GHCR) │   │ + verificación   │
#             └▶ codeql ─┘ └────────────┘   └────────┘   └──────────────────┘
#               (solo PR)                                  (solo push a main)
#
#   Pull Request → main : CI completo (incluye CodeQL), publica sha-<commit> y pr-N
#   Push a main         : CI rápido + publica latest/vX.Y.Z/sha-<commit> + DEPLOY
# =============================================================================
name: CI/CD · Build, Test, Publish & Deploy

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]       # rama de producción → dispara el CD
    tags: ['v*.*.*']               # git tag v1.0.3 && git push origin v1.0.3
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '25'               # build.gradle → toolchain languageVersion = 25
  JAVA_DISTRIBUTION: temurin
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # 1 · BUILD — compila y empaqueta el JAR ejecutable
  # ---------------------------------------------------------------------------
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      short_sha: ${{ steps.version.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Compile & package (bootJar)
        run: ./gradlew bootJar --no-daemon

      - name: Read project version
        id: version
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          RAW=$(./gradlew properties -q --no-daemon | awk '/^version:/ {print $2}')
          VERSION=${RAW%-SNAPSHOT}
          SHORT_SHA=${HEAD_SHA::7}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "📦 Versión \`$RAW\` → etiqueta \`v$VERSION\` · commit \`$SHORT_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2 · TEST — pruebas con PostgreSQL real; credenciales desde GitHub Secrets
  # ---------------------------------------------------------------------------
  test:
    name: 🧪 Test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/${{ secrets.DB_NAME }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.DB_USER }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: ./gradlew test --no-daemon

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: build/test-results/test/*.xml
          detailed_summary: true
          include_passed: true

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3 · CODEQL — SAST del código Java. Solo en Pull Requests: el código que
  #     llega a main ya fue analizado en su PR (ahorra ~2 min en el deploy)
  # ---------------------------------------------------------------------------
  codeql:
    name: 🛡️ CodeQL (SAST)
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin

  # ---------------------------------------------------------------------------
  # 4 · IMAGE SCAN — construye la imagen y la escanea con Trivy ANTES de
  #     publicarla. Si hay CVEs CRITICAL con parche disponible → falla.
  # ---------------------------------------------------------------------------
  image-scan:
    name: 🔍 Trivy image scan
    needs: [build, test, codeql]
    # corre si test pasó y CodeQL pasó o se omitió (push a main)
    if: >-
      !cancelled() &&
      needs.test.result == 'success' &&
      (needs.codeql.result == 'success' || needs.codeql.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local, sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: app:scan
          build-args: |
            APP_VERSION=${{ needs.build.outputs.version }}
            GIT_SHA=${{ needs.build.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # trivy-action 0.35.0 + binario v0.69.3: versiones verificadas tras el
      # incidente de supply-chain de marzo 2026 (CVE-2026-33634)
      - name: Trivy · reporte en el log
        uses: aquasecurity/trivy-action@0.35.0
        with:
          version: v0.69.3
          image-ref: app:scan
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          scanners: vuln
          exit-code: '0'

      - name: Trivy · SARIF para Code scanning
        uses: aquasecurity/trivy-action@0.35.0
        with:
          version: v0.69.3
          image-ref: app:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          scanners: vuln
          skip-setup-trivy: true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Trivy · quality gate (CRITICAL con fix)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          version: v0.69.3
          image-ref: app:scan
          format: table
          severity: CRITICAL
          scanners: vuln
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true

  # ---------------------------------------------------------------------------
  # 5 · DOCKER — construye y publica en GHCR con etiquetado semántico
  # ---------------------------------------------------------------------------
  docker:
    name: 🐳 Publish to GHCR
    needs: [build, image-scan]
    if: ${{ !cancelled() && needs.image-scan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (semantic tags)
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_PR_HEAD_SHA: 'true'
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=v${{ needs.build.outputs.version }},enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=pr
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=acm-ecommerce
            org.opencontainers.image.description=ACM e-commerce API (Spring Boot)

      - name: Build & push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.build.outputs.version }}
            GIT_SHA=${{ needs.build.outputs.short_sha }}
          cache-from: type=gha
          provenance: true
          sbom: true

      - name: Immutable image reference
        id: ref
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME,,}:sha-${{ needs.build.outputs.short_sha }}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          {
            echo "## 🐳 Imagen publicada"
            echo ""
            echo "| Etiqueta |"
            echo "|---|"
            echo '${{ steps.meta.outputs.tags }}' | sed 's/^/| `/; s/$/` |/'
            echo ""
            echo "**Digest:** \`${{ steps.push.outputs.digest }}\`"
            echo ""
            echo "Rollback: \`docker pull $IMAGE\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 6 · DEPLOY — Despliegue continuo en Render + verificación automática.
  #     Solo en push a main. Despliega la imagen INMUTABLE sha-<commit>.
  # ---------------------------------------------------------------------------
  deploy:
    name: 🚀 Deploy to Render
    needs: [build, docker]
    if: >-
      !cancelled() && needs.docker.result == 'success' &&
      github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.RENDER_APP_URL }}
    steps:
      - name: Trigger Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE: ${{ needs.docker.outputs.image }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Falta el secret RENDER_DEPLOY_HOOK_URL"; exit 1
          fi
          ENCODED=$(jq -rn --arg v "$IMAGE" '$v|@uri')
          echo "Desplegando imagen inmutable: $IMAGE"
          curl -fsS -X POST "${HOOK}&imgURL=${ENCODED}" -o /dev/null -w "Render respondió HTTP %{http_code}\n"

      - name: Wait until the new version is live
        env:
          APP_URL: ${{ vars.RENDER_APP_URL }}
          EXPECTED: ${{ needs.build.outputs.short_sha }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Falta la variable RENDER_APP_URL"; exit 1
          fi
          echo "Esperando a que $APP_URL sirva el commit $EXPECTED ..."
          for i in $(seq 1 60); do
            LIVE=$(curl -fsS --max-time 15 "$APP_URL/api/v1/info" | jq -r '.commit' 2>/dev/null || echo "-")
            echo "[$(date +%H:%M:%S)] intento $i · en producción: ${LIVE:-'-'}"
            if [ "$LIVE" = "$EXPECTED" ]; then
              echo "✅ Versión $EXPECTED desplegada"
              break
            fi
            sleep 10
          done
          [ "$LIVE" = "$EXPECTED" ] || { echo "::error::La nueva versión no respondió a tiempo"; exit 1; }

      - name: Smoke test
        env:
          APP_URL: ${{ vars.RENDER_APP_URL }}
        run: |
          INFO=$(curl -fsS "$APP_URL/api/v1/info")
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL/api/v1/products")
          echo "$INFO" | jq .
          echo "GET /api/v1/products → HTTP $CODE"
          [ "$CODE" = "200" ] || { echo "::error::La API no responde correctamente"; exit 1; }
          {
            echo "## 🚀 Desplegado en producción"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| URL | $APP_URL |"
            echo "| Versión | $(echo "$INFO" | jq -r .version) |"
            echo "| Commit | \`$(echo "$INFO" | jq -r .commit)\` |"
            echo "| Iniciada | $(echo "$INFO" | jq -r .startedAt) |"
            echo "| API /products | HTTP $CODE |"
          } >> "$GITHUB_STEP_SUMMARY"
