server:
  port: ${PORT:8080}              # Render inyecta PORT; en local se usa 8080
spring:
  application:
    name: ecommerce
  datasource:
    url: jdbc:postgresql://localhost:5434/ecommerce
    username: store
    password: '123456'
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
app:
  version: ${APP_VERSION:dev}     # lo define el Dockerfile con la versión de build.gradle
  commit: ${GIT_SHA:local}        # short-SHA del commit que generó la imagen
springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /api/v1/api-docs
